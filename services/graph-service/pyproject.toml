[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "graph-service"
version = "0.1.0"
description = "SentinelAPI Graph Service — maintains Neo4j dependency graph and answers reachability queries"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "neo4j==5.20.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "aiokafka==0.10.0",
    "structlog==24.1.0",
    "apscheduler==3.10.4",
    "prometheus-fastapi-instrumentator==7.0.0",
    "httpx==0.27.0",
    "sentinel-shared @ file:///${PROJECT_ROOT}/sentinel_shared",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "hypothesis==6.100.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_service*"]
