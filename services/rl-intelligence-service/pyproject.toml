[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rl-intelligence-service"
version = "0.1.0"
description = "SentinelAPI RL Intelligence Service — PPO reinforcement learning for API threat intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "aiokafka==0.10.0",
    "structlog==24.1.0",
    "apscheduler==3.10.4",
    "prometheus-fastapi-instrumentator==7.0.0",
    "httpx==0.27.0",
    "torch==2.3.0",
    "stable-baselines3==2.3.2",
    "gymnasium==0.29.1",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "xgboost==2.0.3",
    "shap==0.45.0",
    "neo4j==5.19.0",
    "networkx==3.3",
    "sentinel-shared @ file:///${PROJECT_ROOT}/sentinel_shared",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "hypothesis==6.100.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_intelligence_service*"]
