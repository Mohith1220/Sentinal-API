[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-shared"
version = "0.1.0"
description = "Shared models, utilities, and middleware for SentinelAPI microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "starlette==0.37.2",
    "pydantic==2.7.1",
    "structlog==24.1.0",
    "aiokafka==0.10.0",
    "uvicorn[standard]==0.29.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "prometheus-client==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "hypothesis==6.100.1",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_shared*"]
